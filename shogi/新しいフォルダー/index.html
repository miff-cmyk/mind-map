<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>将棋</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>将棋</h1>

  <div class="controls">
    <label>難易度：
      <select id="difficulty">
        <option value="weak">弱い</option>
        <option value="normal" selected>普通</option>
        <option value="strong">強い</option>
      </select>
    </label>
    <label>手番：
      <select id="side">
        <option value="sente" selected>先手（下）</option>
        <option value="gote">後手（上）</option>
      </select>
    </label>
    <button id="newgame">対局開始</button>
    <button id="resign">投了</button>
  </div>

  <div id="status" class="status"></div>

  <div class="layout">
    <div class="board-area">
      <div class="hand" id="hand-gote"><span class="hand-label">後手 持ち駒</span></div>
      <div id="board"></div>
      <div class="hand" id="hand-sente"><span class="hand-label">先手 持ち駒</span></div>
    </div>

    <div class="sidebar">
      <div style="font-size:13px;margin-bottom:4px;">棋譜</div>
      <div id="log"></div>
    </div>
  </div>

  <!-- 読み込み順：データ → ルール → AI → 進行 → UI -->
  <script src="board.js"></script>
  <script src="rules.js"></script>
  <script src="ai.js"></script>
  <script src="game.js"></script>
  <script src="ui.js"></script>
</body>
</html>
